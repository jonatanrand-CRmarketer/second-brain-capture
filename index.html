<!doctype html>
<html lang="et"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mõte">
<meta name="theme-color" content="#111110">
<title>Mõte</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#111110;color:#fff;font:17px/1.4 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));min-height:100vh;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#c2c0b6;font-weight:600}
textarea,input{width:100%;background:#1e1e1c;color:#fff;border:1px solid #3a3a38;border-radius:10px;padding:14px;font:inherit}
textarea{flex:1;min-height:40vh;resize:none}
button{background:#d97e72;color:#2a0d08;border:0;border-radius:10px;padding:16px;font:inherit;font-weight:700;font-size:18px}
button:disabled{opacity:.5}
#s{min-height:1.4em;color:#c2c0b6;font-size:15px}
#s.err{color:#d97e72}
#k{display:none}
#x{background:none;color:#c2c0b6;border:1px solid #3a3a38;font-size:15px;font-weight:600;padding:12px}
#q{display:none;background:#fff;border-radius:10px;padding:16px;text-align:center;color:#111110;font-size:14px}
#q img{width:100%;max-width:320px;height:auto;image-rendering:pixelated;display:block;margin:0 auto 8px}
</style></head><body>
<h1>Mõttekast</h1>
<input id="k" type="password" autocomplete="off" placeholder="GitHubi token (küsitakse ainult kord)">
<textarea id="t" placeholder="Kirjuta või räägi mõte…" autofocus></textarea>
<button id="b">Saada</button>
<div id="s"></div>
<button id="x" type="button">Kanna üle uude telefoni</button>
<div id="q"></div>
<script src="qrcode.js"></script>
<script>
var OWNER="jonatanrand-CRmarketer", REPO="second-brain-inbox", KEY="sb_token", Q="sb_queue";
var ta=document.getElementById("t"), ki=document.getElementById("k"), st=document.getElementById("s"), bt=document.getElementById("b");
function say(m,e){st.textContent=m;st.className=e?"err":"";}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function queue(){try{return JSON.parse(lsGet(Q)||"[]");}catch(e){return [];}}
function setQueue(a){lsSet(Q,JSON.stringify(a));}
// token võib tulla lingi lõpus kujul #t=TOKEN: salvestame ja kustutame aadressiribalt
(function(){
  var m=(location.hash||"").match(/^#t=([\w-]+)$/);
  if(m){ lsSet(KEY,m[1]); try{history.replaceState(null,"",location.pathname+location.search);}catch(e){} }
})();
function needKey(){ki.style.display="block";ki.focus();say("Sisesta token ja vajuta uuesti Saada.",true);}
async function post(text,token){
  return fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/issues",{
    method:"POST",
    headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},
    body:JSON.stringify({title:text.replace(/\s+/g," ").slice(0,80),body:text})
  });
}
async function flush(){
  var token=lsGet(KEY); if(!token){needKey();return false;}
  var a=queue(), rest=[];
  for(var i=0;i<a.length;i++){
    try{
      var r=await post(a[i],token);
      if(r.status===401||r.status===403||r.status===404){ lsDel(KEY); rest=a.slice(i); setQueue(rest); needKey(); return false; }
      if(r.status!==201){ rest.push(a[i]); }
    }catch(e){ rest=rest.concat(a.slice(i)); break; }
  }
  setQueue(rest);
  return rest.length===0;
}
async function send(){
  var typed=ki.value.trim(); if(typed){lsSet(KEY,typed);ki.value="";ki.style.display="none";}
  var tx=ta.value.trim();
  if(tx){ var a=queue(); a.push(tx); setQueue(a); ta.value=""; }
  if(!queue().length){say("Kirjuta enne mõte.",true);return;}
  bt.disabled=true; say("Saadan…");
  var ok=await flush();
  bt.disabled=false;
  if(ok){say("Salvestatud ✓");ta.focus();}
  else if(ki.style.display!=="block"){say("Ühendust pole. Mõte on telefonis alles ja läheb järgmisel Saada vajutusel.",true);}
}
bt.addEventListener("click",send);
window.addEventListener("online",function(){ if(queue().length&&lsGet(KEY)) flush().then(function(ok){ if(ok) say("Salvestatud ✓"); }); });
document.getElementById("x").addEventListener("click",function(){
  var q=document.getElementById("q"), token=lsGet(KEY);
  if(q.style.display==="block"){q.style.display="none";q.textContent="";return;}
  if(!token){say("Selles telefonis pole tokenit, mida üle kanda.",true);return;}
  var url=location.origin+location.pathname+"#t="+token;
  var qr=qrcode(0,"M"); qr.addData(url); qr.make();
  q.innerHTML=qr.createImgTag(6,8)+"Skanni uue telefoni kaameraga ja ava link Safaris. Seejärel sulge see QR siin (vajuta nuppu uuesti).";
  q.style.display="block";
});
if(!lsGet(KEY)) needKey(); else if(queue().length) say(queue().length+" saatmata mõtet. Vajuta Saada.",true);
</script></body></html>
